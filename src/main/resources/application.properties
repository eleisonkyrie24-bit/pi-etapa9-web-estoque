spring.application.name=pi-etapa9-web-estoque
server.port=8080

# Banco persistente em arquivo: permanece entre reinicializacoes da aplicacao.
spring.datasource.url=jdbc:h2:file:./data/estoque;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console habilitado somente para demonstracao/desenvolvimento academico.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
